{% extends 'base.html' %}

{% block title %}Sign In - Amanzon Premium{% endblock %}

{% block content %}
<div class="bg-subtle position-relative overflow-hidden" style="min-height: calc(100vh - 200px);">
    <!-- Decorative background elements -->
    <div class="position-absolute rounded-circle bg-primary opacity-10 blur-xl"
        style="width: 400px; height: 400px; top: -100px; left: -100px; filter: blur(60px); z-index: 0;"></div>
    <div class="position-absolute rounded-circle bg-warning opacity-10 blur-xl"
        style="width: 300px; height: 300px; bottom: 10%; right: -50px; filter: blur(60px); z-index: 0;"></div>

    <div class="container py-5 my-md-5 position-relative z-1 stagger-item">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5 col-xl-4">

                <div class="text-center mb-5">
                    <a href="{% url 'store:index' %}" class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle shadow-sm mb-4 ripple" style="width: 64px; height: 64px;" title="Back to Home">
                        <i class="bi bi-house-door fs-4 text-primary"></i>
                    </a>
                    <h2 class="display-6 fw-bold text-primary mb-2">Welcome Back</h2>
                    <p class="text-secondary fs-5 text-balance">Sign in to access your curated collection.</p>
                </div>

                <div class="bg-white rounded-5 shadow-sm border border-light p-4 p-md-5">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="d-flex flex-column gap-4 mb-4">
                            <div class="form-floating input-wrapper">
                                {{ form.email }}
                                <label for="id_email">Email Address</label>
                            </div>

                            <div>
                                <div class="form-floating input-wrapper position-relative">
                                    {{ form.password }}
                                    <label for="id_password">Password</label>
                                    <button type="button"
                                        class="btn btn-sm btn-link text-secondary position-absolute top-50 end-0 translate-middle-y me-2 text-decoration-none shadow-none" onclick="const p = this.previousElementSibling.previousElementSibling; if(p.type === 'password'){p.type='text'; this.innerHTML='<i class=\'bi bi-eye-slash\'></i>';}else{p.type='password'; this.innerHTML='<i class=\'bi bi-eye\'></i>';}">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="text-end mt-2">
                                    <a href="{% url 'store:password_reset' %}" class="small text-decoration-none text-secondary fw-medium hover-primary">Forgot password?</a>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm ripple position-relative overflow-hidden mb-4 d-flex align-items-center justify-content-center gap-2">
                            <span>Sign In securely</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </form>

                    <div class="position-relative text-center my-4">
                        <hr class="border-secondary opacity-10">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-secondary fw-medium letter-spacing-wide text-uppercase">or</span>
                    </div>

                    <div class="text-center">
                        <p class="mb-0 text-secondary d-flex flex-column flex-sm-row align-items-center justify-content-center gap-2 fs-6">
                            <span>New to Amanzon?</span>
                            <a href="{% url 'store:register' %}" class="fw-bold text-primary text-decoration-none hover-primary position-relative border-bottom border-transparent hover-border-primary pb-1 transition">Create an account</a>
                        </p>
                    </div>
                </div>

                <!-- Trust Badges Mock -->
                <div class="d-flex justify-content-center gap-4 mt-5 opacity-50">
                    <i class="bi bi-shield-lock fs-4"></i>
                    <i class="bi bi-person-check fs-4"></i>
                    <i class="bi bi-fingerprint fs-4"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* MD3 Expressive Input Styles */
    .input-wrapper .form-control {
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-medium);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        background-color: var(--md-sys-color-surface);
        height: 3.5rem;
    }

    .input-wrapper .form-control:focus {
        border-color: var(--md-sys-color-primary);
        box-shadow: 0 0 0 4px var(--md-sys-color-primary-container);
        background-color: var(--md-sys-color-surface);
    }

    .input-wrapper label {
        color: var(--md-sys-color-on-surface-variant);
        font-weight: 500;
    }

    .hover-border-primary:hover {
        border-color: var(--md-sys-color-primary) !important;
    }
</style>

<script>
    // Ensure inputs have form-control class
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"])').forEach(function (input) {
            if (!input.classList.contains('form-control')) {
                input.classList.add('form-control');
            }
        });
    });
</script>
{% endblock %}
