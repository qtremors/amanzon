{% extends 'base.html' %}

{% block title %}Reset Password - Amanzon Premium{% endblock %}

{% block content %}
<div class="bg-subtle position-relative overflow-hidden" style="min-height: calc(100vh - 200px);">
    <!-- Decorative background elements -->
    <div class="position-absolute rounded-circle bg-primary opacity-10 blur-xl" style="width: 400px; height: 400px; top: -100px; left: -100px; filter: blur(60px); z-index: 0;"></div>

    <div class="container py-5 my-md-5 position-relative z-1 stagger-item">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5 col-xl-4">

                <div class="text-center mb-5">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle shadow-sm mb-4" style="width: 64px; height: 64px;">
                        <i class="bi bi-shield-lock fs-3 text-primary"></i>
                    </div>
                    <h2 class="display-6 fw-bold text-primary mb-2">Reset Password</h2>
                    <p class="text-secondary fs-5 text-balance">Enter your email to receive a secure recovery code.</p>
                </div>

                <div class="bg-white rounded-5 shadow-sm border border-light p-4 p-md-5">
                    <form method="POST" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <div class="mb-5">
                            <div class="form-floating input-wrapper">
                                {{ form.email }}
                                <label for="id_email">Email Address</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill py-3 fw-bold shadow-sm ripple position-relative overflow-hidden mb-4 d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-envelope-paper"></i>
                            <span>Send Recovery Code</span>
                        </button>
                    </form>

                    <div class="text-center mt-3">
                            <a href="{% url 'store:login' %}" class="btn btn-outline-secondary border-light bg-subtle rounded-pill px-4 text-secondary hover-primary transition d-inline-flex align-items-center gap-2">
                            <i class="bi bi-arrow-left"></i> Return to Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* MD3 Expressive Input Styles Repeated */
    .input-wrapper .form-control {
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-shape-medium);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        background-color: var(--md-sys-color-surface);
        height: 3.5rem;
    }

    .input-wrapper .form-control:focus {
        border-color: var(--md-sys-color-primary);
        box-shadow: 0 0 0 4px var(--md-sys-color-primary-container);
        background-color: var(--md-sys-color-surface);
    }

    .input-wrapper label {
        color: var(--md-sys-color-on-surface-variant);
        font-weight: 500;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll('input:not([type="hidden"]):not([type="checkbox"])').forEach(function (input) {
            if (!input.classList.contains('form-control')) {
                input.classList.add('form-control');
            }
        });
    });
</script>
{% endblock %}
